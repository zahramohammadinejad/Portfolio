quest</text><text x="145" y="587" text-anchor="middle" class="s">Archive / report</text><path class="dash" d="M325 471v35H145v29"/><text x="750" y="655" text-anchor="middle" class="s">Core pattern: Trigger → Validate → AI Assist → Rules → Task → Human Exception → Status → Notify → Close</text></svg>