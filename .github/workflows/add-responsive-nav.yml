name: Add responsive navigation to all pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  responsive-nav:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add shared mobile navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          for path in root.rglob('*.html'):
              if '.git' in path.parts or path.name == 'index.html':
                  continue

              text = path.read_text(encoding='utf-8')
              depth = len(path.parent.relative_to(root).parts)
              prefix = '../' * depth
              css_tag = f'<link rel="stylesheet" href="{prefix}responsive-nav.css">'
              js_tag = f'<script src="{prefix}responsive-nav.js"></script>'

              if 'responsive-nav.css' not in text:
                  text = text.replace('</head>', f'  {css_tag}\n</head>', 1)

              if 'class="menu-toggle"' not in text:
                  header_match = re.search(r'(<header[^>]*class="navbar"[^>]*>.*?<a class="brand".*?</a>)', text, re.S)
                  if header_match:
                      button = '<button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false"><span></span><span></span><span></span></button>'
                      text = text[:header_match.end()] + button + text[header_match.end():]

              if 'responsive-nav.js' not in text:
                  text = text.replace('</body>', f'  {js_tag}\n</body>', 1)

              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Enable responsive hamburger navigation across all pages"
          git push
