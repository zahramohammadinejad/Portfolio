<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760" role="img" aria-labelledby="title desc">
<title id="title">BPMN 2.0 — Construction File Formation Process</title>
<desc id="desc">English portfolio adaptation of the original Persian BPMN model for the Building Engineering Organization.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6B88A6"/></marker><style>
.lane{fill:#fff;stroke:#D8E7F1;stroke-width:1.4}.label{font:600 14px Arial,sans-serif;fill:#58718B}.task{fill:#E8F5FD;stroke:#4FA8E8;stroke-width:1.8}.txt{font:600 13px Arial,sans-serif;fill:#142A46;text-anchor:middle}.small{font:500 10px Arial,sans-serif;fill:#58718B;text-anchor:middle}.flow{stroke:#6B88A6;stroke-width:2;fill:none;marker-end:url(#arrow)}.msg{stroke:#8AA5BC;stroke-width:1.4;stroke-dasharray:6 5;fill:none;marker-end:url(#arrow)}.gateway{fill:#FFF5D8;stroke:#D9A93A;stroke-width:2}.start{fill:#BFE7B8;stroke:#4E9D52;stroke-width:2}.end{fill:#fff;stroke:#E06C75;stroke-width:3}.doc{fill:#fff;stroke:#9FB7C9;stroke-width:1.3}
</style></defs>
<!-- Swimlanes -->
<rect class="lane" x="0" y="0" width="1700" height="170"/><rect class="lane" x="0" y="170" width="1700" height="160"/><rect class="lane" x="0" y="330" width="1700" height="275"/><rect class="lane" x="0" y="605" width="1700" height="155"/>
<text class="label" x="18" y="95" transform="rotate(-90 18 95)">Applicant / Building Owner</text>
<text class="label" x="18" y="255" transform="rotate(-90 18 255)">Process Owner / Technical Office</text>
<text class="label" x="18" y="465" transform="rotate(-90 18 465)">Engineering Services</text>
<text class="label" x="18" y="680" transform="rotate(-90 18 680)">Construction Group</text>

