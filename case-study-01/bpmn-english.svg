<circle class="start" cx="60" cy="75" r="14"/><path class="flow" d="M74 75H150"/>
<rect class="task" x="150" y="38" rx="10" width="230" height="70"/><text class="txt" x="265" y="67"><tspan x="265">Complete Application Form</tspan><tspan x="265" dy="19">and Submit Documents</tspan></text>
<path class="msg" d="M265 108V385"/>
<rect class="task" x="415" y="38" rx="10" width="125" height="58"/><text class="txt" x="477" y="73">Resolve Deficiencies</text><path class="msg" d="M380 70H415"/>
<path class="flow" d="M540 67H625"/>
