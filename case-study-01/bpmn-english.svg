<path class="msg" d="M975 407V297"/>
<rect class="task" x="1210" y="407" rx="10" width="245" height="76"/><text class="txt" x="1332" y="438"><tspan x="1332">Notify Final Technical</tspan><tspan x="1332" dy="19">Result / Status</tspan></text><path class="flow" d="M1090 445H1210"/>
<path class="flow" d="M1455 445H1570"/><circle class="end" cx="1590" cy="445" r="15"/><circle class="end" cx="1590" cy="445" r="8"/><text class="small" x="1530" y="480">Preparation &amp; review complete</text>
<path class="msg" d="M225 465V605"/>
